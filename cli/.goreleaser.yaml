version: 2
project_name: yalie-pp-cli
changelog:
  disable: true
builds:
  - id: yalie-pp-cli
    main: ./cmd/yalie-pp-cli
    binary: yalie-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X yalie-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: yalie-pp-mcp
    main: ./cmd/yalie-pp-mcp
    binary: yalie-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: yalie-pp-cli
    repository:
      owner: evanwboyle
      name: homebrew-tap
    homepage: "https://github.com/evanwboyle/yalie-pp-cli"
    description: "Every Yale academic tool YalieMCP had, plus offline course search, degree-audit history, and cross-source requirement matching no other Yale tool offers."
    install: |
      bin.install "yalie-pp-cli"
      bin.install "yalie-pp-mcp"
